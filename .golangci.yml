version: "2"

run:
  # Lint the integration tests too (they are excluded from plain builds).
  build-tags:
    - integration

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - revive
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Test helpers write throwaway fixtures; file permissions are not a concern there.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
