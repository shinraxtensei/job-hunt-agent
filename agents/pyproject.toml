[project]
name = "jobhunt-agents"
version = "0.1.0"
description = "Model work for the job-hunt agent: extraction and scoring (M3), run by one worker."
requires-python = "==3.15.*"
dependencies = [
    "anthropic>=2.4.0,<3",
    "psycopg[binary,pool]>=3.3.8,<4",
    "pydantic>=2.14.2,<3",
    "pydantic-settings>=2.16.2,<3",
    "ruamel-yaml>=0.19.1,<0.20",
]

[project.scripts]
jobhunt-worker = "jobhunt_agents.__main__:main"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "testcontainers[postgres]==4.15.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.7"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF", "PL", "PT", "SIM", "TRY", "ANN"]
ignore = ["PLR2004", "TRY003"]

[tool.ruff.lint.pylint]
# Keyword-only call sites (the model client) read fine with more arguments.
max-args = 8

[tool.ruff.lint.per-file-ignores]
# ruamel.yaml values are Any until validated (ADR-0019); validation is one branch per rule.
"src/jobhunt_agents/profile.py" = ["ANN401", "PLR0912"]
"tests/**" = ["S101","S105","S106", "S603", "S607", "PLR0913", "ANN401"]

[tool.pyright]
pythonVersion = "3.15"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
markers = ["integration: needs Docker (a real Postgres from deploy/compose.yaml's image)"]
