name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels that PR's older run. Pushes to master each get their
  # own group (run_id), so they are never cancelled or replaced while queued.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Caches the module and build caches. Keyed on every *.sum so tool bumps
          # in tools.sum (and app deps in go.sum, once there are any) bust it.
          cache-dependency-path: "*.sum"

      - name: gitleaks
        # Built from the module proxy (checksum-verified by sum.golang.org) instead of a
        # third-party action or image: no token or extra permissions. Dependabot does not
        # see this version; bump it here by hand.
        # --log-opts=HEAD: scan only history reachable from this checkout. The default
        # (--all) also scans every other fetched branch, so one bad branch would fail
        # every PR.
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --verbose --log-opts=HEAD .

      # Node is pinned exactly here and bumped by hand like the Go tools (ADR-0013);
      # web/.nvmrc and engines name the major line.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Playwright version
        id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' web/package-lock.json)" >> "$GITHUB_OUTPUT"

      # Chromium is downloaded only when Playwright is bumped.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}

      - name: Playwright browser
        run: |
          make web-install
          if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then
            cd web && npx playwright install-deps chromium
          else
            cd web && npx playwright install --with-deps chromium
          fi

      - name: make check
        run: make check
