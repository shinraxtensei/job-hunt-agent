version: 2
updates:
  # Covers go.mod only. Dependabot has no option for an alternate modfile, so
  # tools.mod (golangci-lint, govulncheck) is bumped by hand:
  #   go get -tool -modfile=tools.mod <pkg>@<version>
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The tracker page (ADR-0013). Grouped and weekly; every bump runs make check (audit,
  # tests, Playwright) before it can merge.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
