version: 2
updates:
  # Covers go.mod only. Dependabot has no option for an alternate modfile, so
  # tools.mod (golangci-lint, govulncheck) is bumped by hand:
  #   go get -tool -modfile=tools.mod <pkg>@<version>
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  # Base images in the Dockerfile and deploy/compose.yaml, pinned by digest (ADR-0016).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The tracker page (ADR-0013). Grouped and weekly; every bump runs make check (audit,
  # tests, Playwright) before it can merge.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the native compiler) can't run typescript-eslint yet: its peer range
      # is <6.1 and it refuses TS 7 (typescript-eslint#10940). Remove when that ships.
      - dependency-name: typescript
        versions: [">=7"]

  # The Python worker (ADR-0017): its lock, and its base images in agents/Dockerfile.
  - package-ecosystem: uv
    directory: /agents
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /agents
    schedule:
      interval: weekly
